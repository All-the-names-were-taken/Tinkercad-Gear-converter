<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tinkercad Metric Gear Converter</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f2f2f2;
            margin: 0;
            padding: 30px;
        }

        .container {
            max-width: 600px;
            margin: auto;
            background: white;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.15);
        }

        h1 {
            text-align: center;
            margin-top: 0;
        }

        .converter {
            border: 1px solid #ddd;
            border-radius: 10px;
            padding: 20px;
            margin-top: 20px;
        }

        h2 {
            margin-top: 0;
        }

        label {
            display: block;
            margin-bottom: 7px;
            font-weight: bold;
        }

        input {
            width: 100%;
            box-sizing: border-box;
            padding: 12px;
            font-size: 18px;
            border: 1px solid #bbb;
            border-radius: 6px;
            margin-bottom: 12px;
        }

        button {
            width: 100%;
            padding: 12px;
            font-size: 17px;
            border: none;
            border-radius: 6px;
            background: #333;
            color: white;
            cursor: pointer;
        }

        button:hover {
            background: #555;
        }

        .result {
            margin-top: 15px;
            padding: 15px;
            background: #eee;
            border-radius: 6px;
            font-size: 20px;
            font-weight: bold;
            text-align: center;
        }

        .note {
            font-size: 14px;
            color: #666;
            margin-top: 8px;
        }
    </style>
</head>

<body>

<div class="container">

    <h1>Tinkercad Metric Gear Converter</h1>

    <!-- TEETH TO DIAMETER -->
    <div class="converter">

        <h2>Teeth → Diameter</h2>

        <label for="teethInput">Number of teeth</label>

        <input
            type="number"
            id="teethInput"
            min="20"
            step="1"
            placeholder="Enter teeth"
        >

        <button onclick="teethToDiameter()">
            Convert
        </button>

        <div class="result" id="teethResult">
            Result will appear here
        </div>

        <div class="note">
            Diameter may contain decimals.
        </div>

    </div>


    <!-- DIAMETER TO TEETH -->
    <div class="converter">

        <h2>Diameter → Teeth</h2>

        <label for="diameterInput">Desired diameter (mm)</label>

        <input
            type="number"
            id="diameterInput"
            min="0"
            step="0.01"
            placeholder="Enter diameter in mm"
        >

        <button onclick="diameterToTeeth()">
            Convert
        </button>

        <div class="result" id="diameterResult">
            Result will appear here
        </div>

        <div class="note">
            The converter always chooses a whole-number gear that is
            at or below the requested diameter.
        </div>

    </div>

</div>


<script>

    /*
        Tinkercad metric gear measurements

        teeth : diameter (mm)
    */

    const gears = [
        { teeth: 20, diameter: 21.81 },
        { teeth: 21, diameter: 22.90 },
        { teeth: 22, diameter: 23.83 },
        { teeth: 23, diameter: 24.91 },
        { teeth: 24, diameter: 25.84 },
        { teeth: 25, diameter: 26.92 },
        { teeth: 26, diameter: 27.85 },
        { teeth: 27, diameter: 28.93 },
        { teeth: 28, diameter: 29.87 },
        { teeth: 29, diameter: 30.93 },
        { teeth: 30, diameter: 31.88 }
    ];


    // ----------------------------------------
    // TEETH → DIAMETER
    // ----------------------------------------

    function teethToDiameter() {

        const teeth = parseInt(
            document.getElementById("teethInput").value
        );

        const result = document.getElementById("teethResult");

        if (isNaN(teeth)) {
            result.textContent = "Enter a number of teeth.";
            return;
        }

        const gear = gears.find(g => g.teeth === teeth);

        if (!gear) {
            result.textContent =
                "No measured value available for " +
                teeth +
                " teeth.";
            return;
        }

        result.textContent =
            gear.teeth +
            " teeth = " +
            gear.diameter.toFixed(2) +
            " mm";
    }


    // ----------------------------------------
    // DIAMETER → TEETH
    // ----------------------------------------

    function diameterToTeeth() {

        const desiredDiameter = parseFloat(
            document.getElementById("diameterInput").value
        );

        const result = document.getElementById("diameterResult");

        if (isNaN(desiredDiameter)) {
            result.textContent = "Enter a diameter.";
            return;
        }

        /*
            Find the largest gear whose diameter
            is NOT greater than the desired diameter.
        */

        let selectedGear = null;

        for (const gear of gears) {

            if (gear.diameter <= desiredDiameter) {
                selectedGear = gear;
            } else {
                break;
            }
        }


        if (!selectedGear) {

            result.textContent =
                "The smallest available gear is 20 teeth (" +
                gears[0].diameter.toFixed(2) +
                " mm).";

            return;
        }


        result.innerHTML =
            selectedGear.teeth +
            " teeth<br>" +
            "<span style='font-size:16px; font-weight:normal'>" +
            "Actual diameter: " +
            selectedGear.diameter.toFixed(2) +
            " mm" +
            "</span>";
    }

</script>

</body>
</html>
